# Portfolio holdings. Edit freely.
#
# Each entry:
#   ticker:  symbol you think of the position by (any format)
#   yahoo:   yfinance symbol (e.g. BRK-B, ADYEN.AS, SAP.DE)
#   sec:     true if filings exist on SEC EDGAR (US-listed or 20-F filer)
#   notes:   your thesis / what to watch — fed to the briefing prompt so reports
#            reflect your view, not generic coverage.

contact_email: jan@cifra.co

