[project]
name = "stockagent"
version = "0.1.0"
description = "Portfolio earnings briefing agent — fetches filings, prices, and transcripts; emits packets for the scheduled routine to turn into morning briefings."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6",
    "yfinance>=0.2.50",
    "click>=8.1",
    "python-dateutil>=2.9",
    "lxml>=5",
]

[project.scripts]
stockagent = "stockagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stockagent"]
